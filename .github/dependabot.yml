version: 2
updates:
  - package-ecosystem: composer
    directory: /php-laravel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /front-vuejs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The challenge requires Vue 2 / BootstrapVue 2 (Bootstrap 4).
      - dependency-name: vue
        update-types: ["version-update:semver-major"]
      - dependency-name: vue-router
        update-types: ["version-update:semver-major"]
      - dependency-name: bootstrap
        update-types: ["version-update:semver-major"]
      # Keep Node typings on the LTS lines the project runs on (20/22).
      - dependency-name: "@types/node"
        versions: ["21.x", ">= 23"]
      # Vue Test Utils 2 only supports Vue 3.
      - dependency-name: "@vue/test-utils"
        update-types: ["version-update:semver-major"]
      # ESLint 9+ requires migrating to the flat config format.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Newer shared configs require ESLint 9 (flat config).
      - dependency-name: "@vue/eslint-config-prettier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vue/eslint-config-typescript"
        update-types: ["version-update:semver-major"]
      # The build is pinned to TypeScript 4.7 (vue-tsc 0.38 for Vue 2.7);
      # @vue/tsconfig >= 0.2 targets newer TypeScript (0.9 needs >= 5.8).
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@vue/tsconfig"
        versions: [">= 0.2"]
      - dependency-name: vue-tsc
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    ignore:
      # Keep Node typings on the LTS lines the project runs on (20/22).
      - dependency-name: "@types/node"
        versions: ["21.x", ">= 23"]
      # TypeScript majors are adopted deliberately, not via automated bumps.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      playwright:
        patterns: ["@playwright/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /php-laravel
    schedule:
      interval: weekly
    ignore:
      # Laravel 10 officially supports PHP 8.1-8.3; stay on 8.2/8.3.
      - dependency-name: php
        versions: [">= 8.4"]

  - package-ecosystem: docker
    directory: /front-vuejs
    schedule:
      interval: weekly
    ignore:
      # Node LTS lines only (20/22); odd and newer majors break the Vite 3 / Vue 2 toolchain.
      - dependency-name: node
        versions: ["21.x", ">= 23"]
