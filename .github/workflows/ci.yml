name: CI

on:
  push:
    branches: [main]
  # Any base branch, so stacked PRs (e.g. one sprint on top of another) are checked too.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (PHP 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: php-laravel
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath
          # Code coverage driver for `php artisan test --coverage` (faster than Xdebug).
          coverage: pcov
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('php-laravel/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Static analysis (Larastan)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests with coverage (SQLite in memory, minimum 80%)
        run: php artisan test --coverage --min=80

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

  web:
    name: Web (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front-vuejs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-vuejs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (no --fix)
        run: npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --ignore-path .gitignore

      # Runs the unit tests once, with coverage (thresholds in vite.config.ts fail the step).
      - name: Unit tests with coverage
        shell: bash
        run: npm run test:coverage 2>&1 | tee coverage-output.txt

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          lcov=coverage/lcov.info
          if [ ! -f "$lcov" ]; then
            echo "No coverage report was generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Totals from the lcov report (lines, functions, branches).
          awk -F: '
            /^LF:/ {lf += $2} /^LH:/ {lh += $2}
            /^FNF:/ {fnf += $2} /^FNH:/ {fnh += $2}
            /^BRF:/ {brf += $2} /^BRH:/ {brh += $2}
            function pct(h, t) { return t ? sprintf("%.1f%%", 100 * h / t) : "n/a" }
            END {
              print "### Front-end coverage (Vitest)\n"
              print "| Metric | Covered | Total | % |"
              print "|---|---:|---:|---:|"
              printf "| Lines | %d | %d | %s |\n", lh, lf, pct(lh, lf)
              printf "| Functions | %d | %d | %s |\n", fnh, fnf, pct(fnh, fnf)
              printf "| Branches | %d | %d | %s |\n", brh, brf, pct(brh, brf)
            }' "$lcov" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage-output.txt ]; then
            {
              echo
              echo "<details><summary>Per-file report</summary>"
              echo
              echo '```'
              # Drop ANSI colors; keep only the coverage table.
              sed -e 's/\x1b\[[0-9;]*m//g' coverage-output.txt | sed -n '/^-*|/,$p'
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          # upload-artifact ignores defaults.run.working-directory.
          path: front-vuejs/coverage
          if-no-files-found: ignore
          retention-days: 7

      - name: Type-check and build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:5173
      E2E_API_URL: http://localhost:8000/api
      # Read by docker compose for the api service; the suite sends ~660 requests per run (peak ~650/min),
      # above the default limit of 300/min. Raise to 2000 if a run peaks above ~800/min.
      API_RATE_LIMIT: 1000
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack (MySQL + API + web)
        run: docker compose up -d --build

      - name: Wait for the API and the front-end
        run: |
          wait_for() {
            local url=$1 deadline=$((SECONDS + 300))
            until curl -fsS -o /dev/null "$url" 2>/dev/null; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::Timed out waiting for $url"
                exit 1
              fi
              sleep 3
            done
            echo "$url is up"
          }
          wait_for "$E2E_API_URL/health"      # readiness probe (not rate limited)
          wait_for "$E2E_API_URL/patients"    # migrations + seed done, DB reachable
          wait_for "$E2E_BASE_URL"

      - name: Check the database migrations ran (fresh DB)
        run: |
          docker compose exec -T api php artisan migrate:status | tee migrate-status.txt
          if grep -q "Pending" migrate-status.txt; then
            echo "::error::There are pending migrations"
            exit 1
          fi
          # Sprint 3 schema: encrypted CPF/RG/phone + change history.
          grep -q "encrypt_patient_sensitive_columns .* Ran" migrate-status.txt
          grep -q "create_patient_audits_table .* Ran" migrate-status.txt

      - name: Warm up Vite (pre-bundle dependencies before the first test)
        run: |
          curl -fsS -o /dev/null "$E2E_BASE_URL/"
          curl -fsS -o /dev/null "$E2E_BASE_URL/src/main.ts"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Docker Compose logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: docker compose down -v
