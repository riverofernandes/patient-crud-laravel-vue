services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: patients
      MYSQL_USER: patients
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    # 3306 is not published on the host on purpose (avoids clashing with a local MySQL).
    # Uncomment to inspect the database from the host:
    # ports:
    #   - "33060:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: ./php-laravel
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./php-laravel:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      # Resolved by the browser, so it must point at the host port, not the container name.
      VITE_API_URL: http://localhost:${API_PORT:-8000}/api
    volumes:
      - ./front-vuejs:/app
      # Keeps the Linux node_modules inside the container, separate from the host's.
      - /app/node_modules
    depends_on:
      - api

volumes:
  mysql-data:
