; Production overrides (on top of php.ini-production)
expose_php = Off
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code is immutable inside the image, so never stat files for changes.
opcache.validate_timestamps = 0
