; Loaded after www.conf / zz-docker.conf (alphabetical order).
[global]
error_log = /proc/self/fd/2
log_level = warning

[www]
; FPM runs as www-data already (container USER), so the user/group directives are ignored.
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
; Keep container env vars (DB_*, APP_KEY...) visible to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
