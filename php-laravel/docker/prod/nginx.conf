# Runs as a non-root user: unprivileged port, pid and temp files under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No query string ($uri, not $request): search filters may carry a CPF. The app logs each request too
    # (JSON on stderr, with the same X-Request-Id).
    log_format main escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
                                '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
                                '"request_id":"$sent_http_x_request_id"}';
    access_log /dev/stdout main;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    # Above PHP's post_max_size (12M) on purpose: bodies between 12 and 13 MB reach Laravel, which answers with the
    # JSON 413 (pt-BR message, CORS and X-Request-Id). Larger bodies are cut here by nginx (see @too_large).
    client_max_body_size 13m;

    # Same rule as the app (AssignRequestId) for the responses nginx answers itself: reuse a safe incoming
    # X-Request-Id, otherwise nginx's own id.
    map $http_x_request_id $app_request_id {
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
        default $request_id;
    }

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain application/x-yaml image/svg+xml;

    server {
        listen 8000 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Bodies above client_max_body_size never reach PHP: answer with the same JSON as the app's 413. nginx cannot
        # read CORS_ALLOWED_ORIGINS, so it echoes the request Origin on this error only (the body carries no data).
        error_page 413 = @too_large;

        location @too_large {
            default_type application/json;
            add_header X-Request-Id $app_request_id always;
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Expose-Headers X-Request-Id always;
            add_header Vary Origin always;
            add_header X-Content-Type-Options "nosniff" always;
            return 413 '{"message":"O arquivo enviado é grande demais."}';
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
