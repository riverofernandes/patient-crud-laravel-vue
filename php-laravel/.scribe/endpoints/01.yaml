name: Pacientes
description: |-

  Cadastro de pacientes: listagem com busca, ordenação e paginação, detalhe, criação, atualização,
  exclusão lógica (lixeira), restauração e verificação de disponibilidade de CPF.
endpoints:
  -
    httpMethods:
      - GET
    uri: api/patients/cpf-availability
    metadata:
      groupName: Pacientes
      groupDescription: |-

        Cadastro de pacientes: listagem com busca, ordenação e paginação, detalhe, criação, atualização,
        exclusão lógica (lixeira), restauração e verificação de disponibilidade de CPF.
      subgroup: ''
      subgroupDescription: ''
      title: 'Verificar disponibilidade de CPF'
      description: |-
        Informa se um CPF pode ser usado em um cadastro (não pertence a nenhum paciente ativo). Pacientes excluídos
        não contam. Na edição, envie `ignore` com o ID do próprio paciente. CPF inválido retorna 422 com as mesmas
        mensagens do cadastro.
      authenticated: false
      custom: []
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      cpf:
        name: cpf
        description: 'CPF a verificar, com ou sem máscara. Deve ser válido (dígitos verificadores conferidos).'
        required: true
        example: 625.189.530-60
        type: string
        enumValues: []
        exampleWasSpecified: false
        custom: []
      ignore:
        name: ignore
        description: 'ID de um paciente a desconsiderar (use na edição para não acusar o próprio CPF). Must be at least 1.'
        required: false
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        custom: []
    cleanQueryParameters:
      cpf: 625.189.530-60
      ignore: 1
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        status: 200
        content: '{"available": true}'
        headers: []
        description: 'CPF disponível'
        custom: []
      -
        status: 200
        content: '{"available": false, "message": "Já existe um paciente cadastrado com este CPF."}'
        headers: []
        description: 'CPF em uso'
        custom: []
      -
        status: 422
        content: '{"message": "O CPF informado é inválido.", "errors": {"cpf": ["O CPF informado é inválido."]}}'
        headers: []
        description: 'CPF inválido'
        custom: []
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
    custom: []
