  '/api/patients/{patient_id}/restore':
    post:
      summary: 'Restaurar paciente'
      operationId: restaurarPaciente
      description: "Restaura um paciente da lixeira (desfaz a exclusão lógica). Falha com 409 se outro paciente ativo\nestiver usando o mesmo CPF (o CPF pode ter sido reutilizado depois da exclusão)."
      parameters: []
      responses:
        200:
          description: 'Paciente restaurado'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Maria da Silva'
                    cpf: '62518953060'
                    rg: 35688019X
                    birth_date: '1996-07-20'
                    sex: F
                    phone: '11928535718'
                    email: maria@example.com
                    description: 'Paciente com miopia leve, retorno anual.'
                    created_at: '2026-10-26T15:30:00-03:00'
                    updated_at: '2026-10-26T15:45:00-03:00'
                    age: 30
                    deleted_at: null
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Maria da Silva'
                      cpf:
                        type: string
                        example: '62518953060'
                      rg:
                        type: string
                        example: 35688019X
                      birth_date:
                        type: string
                        example: '1996-07-20'
                      sex:
                        type: string
                        example: F
                      phone:
                        type: string
                        example: '11928535718'
                      email:
                        type: string
                        example: maria@example.com
                      description:
                        type: string
                        example: 'Paciente com miopia leve, retorno anual.'
                      created_at:
                        type: string
                        example: '2026-10-26T15:30:00-03:00'
                      updated_at:
                        type: string
                        example: '2026-10-26T15:45:00-03:00'
                      age:
                        type: integer
                        example: 30
                      deleted_at:
                        type: string
                        example: null
        404:
          description: 'Paciente não encontrado ou não excluído'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Paciente não encontrado.'
                properties:
                  message:
                    type: string
                    example: 'Paciente não encontrado.'
        409:
          description: 'CPF em uso por outro paciente ativo'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Já existe um paciente ativo com este CPF.'
                properties:
                  message:
                    type: string
                    example: 'Já existe um paciente ativo com este CPF.'
      tags:
        - Pacientes
      security: []
    parameters:
      -
        in: path
        name: patient_id
        description: 'ID do paciente excluído.'
        example: 1
        required: true
        schema:
          type: integer
  /api/patients:
    get:
      summary: 'Listar pacientes'
      operationId: listarPacientes
      description: "Retorna os pacientes ativos (não excluídos), com paginação no formato padrão do Laravel. Com `trashed=only`,\nlista apenas os pacientes da lixeira (excluídos), com `deleted_at` preenchido; busca, ordenação e paginação\ncontinuam valendo. Cada paciente traz `age` (idade em anos completos no fuso America/Sao_Paulo).\nOs filtros (`search`, `sex`, `age_min`, `age_max`) se combinam entre si e com a lixeira; todos os\nparâmetros são mantidos nos links de paginação."
      parameters:
        -
          in: query
          name: search
          description: 'Busca por parte do nome, ou pelo CPF **completo** (11 dígitos, com ou sem máscara). CPF parcial não é buscável: o CPF é armazenado criptografado.'
          example: maria
          required: false
          schema:
            type: string
            description: 'Busca por parte do nome, ou pelo CPF **completo** (11 dígitos, com ou sem máscara). CPF parcial não é buscável: o CPF é armazenado criptografado.'
            example: maria
        -
          in: query
          name: sex
          description: 'Filtra por sexo: `M` ou `F` (outro valor é ignorado).'
          example: F
          required: false
          schema:
            type: string
            description: 'Filtra por sexo: `M` ou `F` (outro valor é ignorado).'
            example: F
        -
          in: query
          name: age_min
          description: 'Idade mínima em anos completos (0 a 150; valor inválido é ignorado).'
          example: 18
          required: false
          schema:
            type: integer
            description: 'Idade mínima em anos completos (0 a 150; valor inválido é ignorado).'
            example: 18
        -
          in: query
          name: age_max
          description: 'Idade máxima em anos completos (0 a 150; valor inválido é ignorado).'
          example: 65
          required: false
          schema:
            type: integer
            description: 'Idade máxima em anos completos (0 a 150; valor inválido é ignorado).'
            example: 65
        -
          in: query
          name: page
          description: 'Página desejada. Padrão: 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Página desejada. Padrão: 1.'
            example: 1
        -
          in: query
          name: per_page
          description: 'Itens por página. Padrão: 10; máximo: 100 (valores maiores são limitados a 100).'
          example: 10
          required: false
          schema:
            type: integer
            description: 'Itens por página. Padrão: 10; máximo: 100 (valores maiores são limitados a 100).'
            example: 10
        -
          in: query
          name: sort
          description: 'Campo de ordenação: `name`, `birth_date` ou `created_at`. Padrão: `name` (valor fora da lista também usa `name`).'
          example: name
          required: false
          schema:
            type: string
            description: 'Campo de ordenação: `name`, `birth_date` ou `created_at`. Padrão: `name` (valor fora da lista também usa `name`).'
            example: name
        -
          in: query
          name: direction
          description: 'Sentido da ordenação: `asc` ou `desc`. Padrão: `asc` (valor inválido também usa `asc`). O desempate é sempre por `id` crescente.'
          example: asc
          required: false
          schema:
            type: string
            description: 'Sentido da ordenação: `asc` ou `desc`. Padrão: `asc` (valor inválido também usa `asc`). O desempate é sempre por `id` crescente.'
            example: asc
        -
          in: query
          name: trashed
          description: 'Use `only` para listar apenas os pacientes excluídos (lixeira).'
          example: only
          required: false
          schema:
            type: string
            description: 'Use `only` para listar apenas os pacientes excluídos (lixeira).'
            example: only
      responses:
        200:
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      name: 'Maria da Silva'
                      cpf: '62518953060'
                      rg: 35688019X
                      birth_date: '1996-07-20'
                      sex: F
                      phone: '11928535718'
                      email: maria@example.com
                      description: 'Paciente com miopia leve, retorno anual.'
                      created_at: '2026-10-26T15:30:00-03:00'
                      updated_at: '2026-10-26T15:30:00-03:00'
                      age: 30
                      deleted_at: null
                    -
                      id: 2
                      name: 'João Pereira Santos'
                      cpf: '52998224725'
                      rg: '123456789'
                      birth_date: '1980-03-15'
                      sex: M
                      phone: '1133334444'
