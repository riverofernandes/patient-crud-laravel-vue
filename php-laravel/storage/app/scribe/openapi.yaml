                                old:
                                  type: string
                                  example: '11928535718'
                                new:
                                  type: string
                                  example: '11911111111'
                        ip:
                          type: string
                          example: 172.18.0.1
                        user_agent:
                          type: string
                          example: 'Mozilla/5.0 (X11; Linux x86_64)'
                        user_id:
                          type: string
