  '/api/patients/{patient_id}/photo':
    get:
      summary: 'Foto do paciente'
      operationId: fotoDoPaciente
      description: "A foto (JPEG, até 512x512) do paciente. A URL com `?v=<versão>` vem em `photo_url` no recurso do paciente;\na versão muda a cada troca, então a resposta pode ficar em cache no navegador (`Cache-Control: private,\nmax-age=86400`). `404` se o paciente não tiver foto, não existir ou estiver na lixeira."
      parameters:
        -
          in: query
          name: v
          description: 'Versão da foto (só para invalidar o cache; ignorada pelo servidor).'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Versão da foto (só para invalidar o cache; ignorada pelo servidor).'
            example: 1
      responses:
        200:
          description: 'Imagem (image/jpeg)'
          content:
            text/plain:
              schema:
                type: string
                example: '<binário JPEG>'
        404:
          description: 'Paciente sem foto'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Foto não encontrada.'
                properties:
                  message:
                    type: string
                    example: 'Foto não encontrada.'
      tags:
        - Pacientes
      security: []
    post:
      summary: 'Enviar foto do paciente'
      operationId: enviarFotoDoPaciente
      description: "Envia ou troca a foto (multipart, campo `photo`): JPEG, PNG ou WebP (tipo conferido pelo conteúdo), até 2 MB,\nentre 100x100 e 4000x4000 px. A imagem é reprocessada no servidor (corte quadrado centralizado, no máximo\n512x512, JPEG), o que remove os metadados EXIF (como a localização), e fica criptografada em disco privado.\nGera um registro `photo` no histórico (sem a imagem). Retorna o paciente com o novo `photo_url`."
      parameters: []
      responses:
        200:
          description: 'Foto enviada'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Maria da Silva'
                    cpf: '62518953060'
                    rg: 35688019X
                    birth_date: '1996-07-20'
                    sex: F
                    phone: '11928535718'
                    email: maria@example.com
                    description: null
                    created_at: '2026-10-26T15:30:00-03:00'
                    updated_at: '2026-11-03T10:00:00-03:00'
                    age: 30
                    deleted_at: null
                    address: null
                    photo_url: 'http://localhost:8000/api/patients/1/photo?v=1'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Maria da Silva'
                      cpf:
                        type: string
                        example: '62518953060'
                      rg:
                        type: string
                        example: 35688019X
                      birth_date:
                        type: string
                        example: '1996-07-20'
                      sex:
                        type: string
                        example: F
                      phone:
                        type: string
                        example: '11928535718'
                      email:
                        type: string
                        example: maria@example.com
                      description:
                        type: string
                        example: null
                      created_at:
                        type: string
                        example: '2026-10-26T15:30:00-03:00'
                      updated_at:
                        type: string
                        example: '2026-11-03T10:00:00-03:00'
                      age:
                        type: integer
                        example: 30
                      deleted_at:
                        type: string
                        example: null
                      address:
                        type: string
                        example: null
                      photo_url:
                        type: string
                        example: 'http://localhost:8000/api/patients/1/photo?v=1'
        404:
          description: 'Paciente não encontrado ou excluído'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Paciente não encontrado.'
                properties:
                  message:
                    type: string
                    example: 'Paciente não encontrado.'
        422:
          description: 'Tipo inválido'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'A foto deve ser uma imagem JPEG, PNG ou WebP.'
                  errors:
                    photo:
                      - 'A foto deve ser uma imagem JPEG, PNG ou WebP.'
                properties:
                  message:
                    type: string
                    example: 'A foto deve ser uma imagem JPEG, PNG ou WebP.'
                  errors:
                    type: object
                    properties:
                      photo:
                        type: array
                        example:
                          - 'A foto deve ser uma imagem JPEG, PNG ou WebP.'
                        items:
                          type: string
      tags:
        - Pacientes
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
                  description: 'Imagem JPEG, PNG ou WebP (conferido pelo conteúdo), até 2 MB, entre 100x100 e 4000x4000 px. Reprocessada no servidor: corte quadrado centralizado, no máximo 512x512, JPEG, sem metadados EXIF. Must be a file. Must not be greater than 2048 kilobytes.'
              required:
                - photo
