                        example: 2
                      total:
                        type: integer
                        example: 2
        404:
          description: 'Paciente não encontrado'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Paciente não encontrado.'
                properties:
                  message:
                    type: string
                    example: 'Paciente não encontrado.'
