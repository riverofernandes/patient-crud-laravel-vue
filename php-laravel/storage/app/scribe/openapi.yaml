openapi: 3.0.3
info:
  title: 'API de Pacientes'
  description: 'API REST para cadastro, consulta, edição e exclusão (soft delete) de pacientes.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
paths:
  /api/patients:
    get:
      summary: 'Listar pacientes'
      operationId: listarPacientes
      description: 'Retorna os pacientes ativos (não excluídos) ordenados por nome, com paginação no formato padrão do Laravel.'
      parameters:
        -
          in: query
          name: search
          description: 'Busca por parte do nome ou pelo CPF (com ou sem máscara).'
          example: maria
          required: false
          schema:
            type: string
            description: 'Busca por parte do nome ou pelo CPF (com ou sem máscara).'
            example: maria
        -
          in: query
          name: page
          description: 'Página desejada. Padrão: 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Página desejada. Padrão: 1.'
            example: 1
        -
          in: query
          name: per_page
          description: 'Itens por página. Padrão: 10; máximo: 100 (valores maiores são limitados a 100).'
          example: 10
          required: false
          schema:
            type: integer
            description: 'Itens por página. Padrão: 10; máximo: 100 (valores maiores são limitados a 100).'
            example: 10
      responses:
        200:
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      name: 'Maria da Silva'
                      cpf: '62518953060'
                      rg: 35688019X
                      birth_date: '1996-07-20'
                      sex: F
                      phone: '11928535718'
                      email: maria@example.com
                      description: 'Paciente com miopia leve, retorno anual.'
                      created_at: '2026-10-26T15:30:00-03:00'
                      updated_at: '2026-10-26T15:30:00-03:00'
                    -
                      id: 2
                      name: 'João Pereira Santos'
                      cpf: '52998224725'
                      rg: '123456789'
                      birth_date: '1980-03-15'
                      sex: M
                      phone: '1133334444'
                      email: null
                      description: null
                      created_at: '2026-10-26T15:31:00-03:00'
                      updated_at: '2026-10-26T15:31:00-03:00'
                  links:
                    first: 'http://localhost:8000/api/patients?page=1'
                    last: 'http://localhost:8000/api/patients?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
                    links:
                      -
                        url: null
                        label: '&laquo; Previous'
                        active: false
                      -
                        url: 'http://localhost:8000/api/patients?page=1'
                        label: '1'
                        active: true
                      -
                        url: null
                        label: 'Next &raquo;'
                        active: false
                    path: 'http://localhost:8000/api/patients'
                    per_page: 10
                    to: 2
                    total: 2
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: 'Maria da Silva'
                        cpf: '62518953060'
                        rg: 35688019X
                        birth_date: '1996-07-20'
                        sex: F
                        phone: '11928535718'
                        email: maria@example.com
                        description: 'Paciente com miopia leve, retorno anual.'
                        created_at: '2026-10-26T15:30:00-03:00'
                        updated_at: '2026-10-26T15:30:00-03:00'
                      -
                        id: 2
                        name: 'João Pereira Santos'
                        cpf: '52998224725'
                        rg: '123456789'
                        birth_date: '1980-03-15'
                        sex: M
                        phone: '1133334444'
                        email: null
                        description: null
                        created_at: '2026-10-26T15:31:00-03:00'
                        updated_at: '2026-10-26T15:31:00-03:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'Maria da Silva'
                        cpf:
                          type: string
                          example: '62518953060'
                        rg:
                          type: string
                          example: 35688019X
                        birth_date:
                          type: string
                          example: '1996-07-20'
                        sex:
                          type: string
                          example: F
                        phone:
                          type: string
                          example: '11928535718'
                        email:
                          type: string
                          example: maria@example.com
                        description:
                          type: string
                          example: 'Paciente com miopia leve, retorno anual.'
                        created_at:
                          type: string
                          example: '2026-10-26T15:30:00-03:00'
                        updated_at:
                          type: string
                          example: '2026-10-26T15:30:00-03:00'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'http://localhost:8000/api/patients?page=1'
                      last:
                        type: string
                        example: 'http://localhost:8000/api/patients?page=1'
                      prev:
                        type: string
                        example: null
                      next:
                        type: string
                        example: null
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      links:
                        type: array
                        example:
                          -
                            url: null
                            label: '&laquo; Previous'
                            active: false
                          -
                            url: 'http://localhost:8000/api/patients?page=1'
                            label: '1'
                            active: true
                          -
                            url: null
                            label: 'Next &raquo;'
                            active: false
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: null
                            label:
                              type: string
                              example: '&laquo; Previous'
                            active:
                              type: boolean
                              example: false
                      path:
                        type: string
                        example: 'http://localhost:8000/api/patients'
                      per_page:
                        type: integer
                        example: 10
                      to:
                        type: integer
                        example: 2
                      total:
                        type: integer
                        example: 2
      tags:
        - Pacientes
      security: []
    post:
      summary: 'Cadastrar paciente'
      operationId: cadastrarPaciente
      description: "Cria um paciente. CPF, RG e celular podem ser enviados com máscara; são armazenados só com dígitos.\nO CPF deve ser válido e único entre os pacientes ativos."
      parameters: []
      responses:
        201:
          description: 'Paciente criado'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Maria da Silva'
                    cpf: '62518953060'
                    rg: 35688019X
                    birth_date: '1996-07-20'
                    sex: F
                    phone: '11928535718'
                    email: maria@example.com
                    description: 'Paciente com miopia leve, retorno anual.'
                    created_at: '2026-10-26T15:30:00-03:00'
                    updated_at: '2026-10-26T15:30:00-03:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Maria da Silva'
                      cpf:
                        type: string
                        example: '62518953060'
                      rg:
                        type: string
                        example: 35688019X
                      birth_date:
                        type: string
                        example: '1996-07-20'
                      sex:
                        type: string
                        example: F
                      phone:
                        type: string
                        example: '11928535718'
                      email:
                        type: string
                        example: maria@example.com
                      description:
                        type: string
                        example: 'Paciente com miopia leve, retorno anual.'
                      created_at:
                        type: string
                        example: '2026-10-26T15:30:00-03:00'
                      updated_at:
                        type: string
                        example: '2026-10-26T15:30:00-03:00'
        422:
          description: 'Erro de validação'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'O campo nome completo é obrigatório. (and 1 more error)'
                  errors:
                    name:
                      - 'O campo nome completo é obrigatório.'
                    cpf:
                      - 'O CPF informado é inválido.'
                properties:
                  message:
                    type: string
                    example: 'O campo nome completo é obrigatório. (and 1 more error)'
                  errors:
                    type: object
                    properties:
                      name:
                        type: array
                        example:
                          - 'O campo nome completo é obrigatório.'
                        items:
                          type: string
                      cpf:
                        type: array
                        example:
                          - 'O CPF informado é inválido.'
                        items:
                          type: string
      tags:
        - Pacientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nome completo do paciente (3 a 255 caracteres). Must be at least 3 characters. Must not be greater than 255 characters.'
                  example: 'Maria da Silva'
                cpf:
                  type: string
                  description: 'CPF válido (dígitos verificadores conferidos), com ou sem máscara. Único entre os pacientes ativos. Armazenado só com dígitos.'
                  example: 625.189.530-60
                rg:
                  type: string
                  description: 'RG, com ou sem máscara (até 20 caracteres). Armazenado só com dígitos e a letra X. Must not be greater than 20 characters.'
                  example: 35.688.019-X
                birth_date:
                  type: string
                  description: 'Data de nascimento no formato AAAA-MM-DD; não pode ser futura. Must be a valid date in the format <code>Y-m-d</code>. Must be a date before or equal to <code>today</code>.'
                  example: '1996-07-20'
                sex:
                  type: string
                  description: 'Sexo: `M` (Masculino) ou `F` (Feminino).'
                  example: F
                  enum:
                    - M
                    - F
                phone:
                  type: string
                  description: 'Celular com DDD, com ou sem máscara (10 ou 11 dígitos). Armazenado só com dígitos. Must be between 10 and 11 digits.'
                  example: '(11) 92853-5718'
                email:
                  type: string
                  description: 'E-mail do paciente (opcional). Must be a valid email address. Must not be greater than 255 characters.'
                  example: maria@example.com
                description:
                  type: string
                  description: 'Observações sobre o paciente (opcional, até 2000 caracteres). Must not be greater than 2000 characters.'
                  example: 'Paciente com miopia leve, retorno anual.'
              required:
                - name
                - cpf
                - rg
                - birth_date
                - sex
                - phone
      security: []
  '/api/patients/{id}':
    get:
      summary: 'Detalhar paciente'
      operationId: detalharPaciente
      description: ''
      parameters: []
      responses:
        200:
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Maria da Silva'
                    cpf: '62518953060'
                    rg: 35688019X
                    birth_date: '1996-07-20'
                    sex: F
                    phone: '11928535718'
                    email: maria@example.com
                    description: 'Paciente com miopia leve, retorno anual.'
                    created_at: '2026-10-26T15:30:00-03:00'
                    updated_at: '2026-10-26T15:30:00-03:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Maria da Silva'
                      cpf:
                        type: string
                        example: '62518953060'
                      rg:
                        type: string
                        example: 35688019X
                      birth_date:
                        type: string
                        example: '1996-07-20'
                      sex:
                        type: string
                        example: F
                      phone:
                        type: string
                        example: '11928535718'
                      email:
                        type: string
                        example: maria@example.com
                      description:
                        type: string
                        example: 'Paciente com miopia leve, retorno anual.'
                      created_at:
                        type: string
                        example: '2026-10-26T15:30:00-03:00'
                      updated_at:
                        type: string
                        example: '2026-10-26T15:30:00-03:00'
        404:
          description: 'Paciente não encontrado ou excluído'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Paciente não encontrado.'
                properties:
                  message:
                    type: string
                    example: 'Paciente não encontrado.'
      tags:
        - Pacientes
      security: []
    put:
      summary: 'Atualizar paciente'
      operationId: atualizarPaciente
      description: 'Substituição completa (PUT): envie todos os campos. Campos opcionais omitidos (`email`, `description`) são apagados.'
      parameters: []
      responses:
        200:
          description: 'Paciente atualizado'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Maria da Silva'
                    cpf: '62518953060'
                    rg: 35688019X
                    birth_date: '1996-07-20'
                    sex: F
                    phone: '11928535718'
                    email: maria@example.com
                    description: 'Paciente com miopia leve, retorno anual.'
                    created_at: '2026-10-26T15:30:00-03:00'
                    updated_at: '2026-10-26T15:30:00-03:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Maria da Silva'
                      cpf:
                        type: string
                        example: '62518953060'
                      rg:
                        type: string
                        example: 35688019X
                      birth_date:
                        type: string
                        example: '1996-07-20'
                      sex:
                        type: string
                        example: F
                      phone:
                        type: string
                        example: '11928535718'
                      email:
                        type: string
                        example: maria@example.com
                      description:
                        type: string
                        example: 'Paciente com miopia leve, retorno anual.'
                      created_at:
                        type: string
                        example: '2026-10-26T15:30:00-03:00'
                      updated_at:
                        type: string
                        example: '2026-10-26T15:30:00-03:00'
        404:
          description: 'Paciente não encontrado ou excluído'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Paciente não encontrado.'
                properties:
                  message:
                    type: string
                    example: 'Paciente não encontrado.'
        422:
          description: 'Erro de validação'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'O campo nome completo é obrigatório. (and 1 more error)'
                  errors:
                    name:
                      - 'O campo nome completo é obrigatório.'
                    cpf:
                      - 'O CPF informado é inválido.'
                properties:
                  message:
                    type: string
                    example: 'O campo nome completo é obrigatório. (and 1 more error)'
                  errors:
                    type: object
                    properties:
                      name:
                        type: array
                        example:
                          - 'O campo nome completo é obrigatório.'
                        items:
                          type: string
                      cpf:
                        type: array
                        example:
                          - 'O CPF informado é inválido.'
                        items:
                          type: string
      tags:
        - Pacientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nome completo do paciente (3 a 255 caracteres). Must be at least 3 characters. Must not be greater than 255 characters.'
                  example: 'Maria da Silva'
                cpf:
                  type: string
                  description: 'CPF válido (dígitos verificadores conferidos), com ou sem máscara. Único entre os pacientes ativos. Armazenado só com dígitos.'
                  example: 625.189.530-60
                rg:
                  type: string
                  description: 'RG, com ou sem máscara (até 20 caracteres). Armazenado só com dígitos e a letra X. Must not be greater than 20 characters.'
                  example: 35.688.019-X
                birth_date:
                  type: string
                  description: 'Data de nascimento no formato AAAA-MM-DD; não pode ser futura. Must be a valid date in the format <code>Y-m-d</code>. Must be a date before or equal to <code>today</code>.'
                  example: '1996-07-20'
                sex:
                  type: string
                  description: 'Sexo: `M` (Masculino) ou `F` (Feminino).'
                  example: F
                  enum:
                    - M
                    - F
                phone:
                  type: string
                  description: 'Celular com DDD, com ou sem máscara (10 ou 11 dígitos). Armazenado só com dígitos. Must be between 10 and 11 digits.'
                  example: '(11) 92853-5718'
                email:
                  type: string
                  description: 'E-mail do paciente (opcional). Must be a valid email address. Must not be greater than 255 characters.'
                  example: maria@example.com
                description:
                  type: string
                  description: 'Observações sobre o paciente (opcional, até 2000 caracteres). Must not be greater than 2000 characters.'
                  example: 'Paciente com miopia leve, retorno anual.'
              required:
                - name
                - cpf
                - rg
                - birth_date
                - sex
                - phone
      security: []
    delete:
      summary: 'Excluir paciente'
      operationId: excluirPaciente
      description: "Exclusão lógica (soft delete): o registro permanece no banco com `deleted_at` preenchido, deixa de aparecer\nna listagem e passa a retornar 404. O CPF de um paciente excluído pode ser reutilizado em um novo cadastro."
      parameters: []
      responses:
        204:
          description: 'Paciente excluído'
        404:
          description: 'Paciente não encontrado ou excluído'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Paciente não encontrado.'
                properties:
                  message:
                    type: string
                    example: 'Paciente não encontrado.'
      tags:
        - Pacientes
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the patient.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: patient
        description: 'ID do paciente.'
        example: 1
        required: true
        schema:
          type: integer
  /api/health:
    get:
      summary: 'Verificar saúde da API'
      operationId: verificarSadeDaAPI
      description: "Usado por healthchecks de container e monitoramento. Verifica a conexão com o banco de dados.\nNão sofre limite de requisições (throttle)."
      parameters: []
      responses:
        200:
          description: 'API e banco disponíveis'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: ok
                properties:
                  status:
                    type: string
                    example: ok
        503:
          description: 'Banco de dados indisponível'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: unavailable
                  message: 'Banco de dados indisponível.'
                properties:
                  status:
                    type: string
                    example: unavailable
                  message:
                    type: string
                    example: 'Banco de dados indisponível.'
      tags:
        - Monitoramento
      security: []
tags:
  -
    name: Pacientes
    description: "\nCadastro de pacientes: listagem com busca e paginação, detalhe, criação, atualização e exclusão lógica."
  -
    name: Monitoramento
    description: ''
