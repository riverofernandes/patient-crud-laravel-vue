openapi: 3.0.3
info:
  title: 'API de Pacientes'
  description: 'API REST para cadastro, consulta, edição e exclusão (soft delete) de pacientes.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
paths:
  /api/patients/cpf-availability:
    get:
      summary: 'Verificar disponibilidade de CPF'
      operationId: verificarDisponibilidadeDeCPF
      description: "Informa se um CPF pode ser usado em um cadastro (não pertence a nenhum paciente ativo). Pacientes excluídos\nnão contam. Na edição, envie `ignore` com o ID do próprio paciente. CPF inválido retorna 422 com as mesmas\nmensagens do cadastro."
      parameters:
        -
          in: query
          name: cpf
          description: 'CPF a verificar, com ou sem máscara. Deve ser válido (dígitos verificadores conferidos).'
          example: 625.189.530-60
          required: true
          schema:
            type: string
            description: 'CPF a verificar, com ou sem máscara. Deve ser válido (dígitos verificadores conferidos).'
            example: 625.189.530-60
        -
          in: query
          name: ignore
          description: 'ID de um paciente a desconsiderar (use na edição para não acusar o próprio CPF). Must be at least 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'ID de um paciente a desconsiderar (use na edição para não acusar o próprio CPF). Must be at least 1.'
            example: 1
      responses:
        200:
          description: 'CPF em uso'
          content:
            application/json:
              schema:
                type: object
                example:
                  available: false
                  message: 'Já existe um paciente cadastrado com este CPF.'
                properties:
                  available:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Já existe um paciente cadastrado com este CPF.'
        422:
          description: 'CPF inválido'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'O CPF informado é inválido.'
                  errors:
                    cpf:
                      - 'O CPF informado é inválido.'
                properties:
                  message:
                    type: string
                    example: 'O CPF informado é inválido.'
                  errors:
                    type: object
                    properties:
                      cpf:
                        type: array
                        example:
                          - 'O CPF informado é inválido.'
                        items:
                          type: string
      tags:
        - Pacientes
      security: []
  /api/patients/export:
    get:
      summary: 'Exportar pacientes (CSV)'
      operationId: exportarPacientesCSV
      description: "Baixa os pacientes em CSV, com os mesmos filtros e ordenação da listagem (`search`, `sex`, `age_min`,\n`age_max`, `sort`, `direction`, `trashed`) e sem paginação. Arquivo UTF-8 com BOM, separador `;` e\nquebra de linha CRLF (abre direto no Excel em pt-BR), nome `pacientes-AAAAMMDD-HHMM.csv` (horário de\nBrasília). Valores formatados: CPF `000.000.000-00`, celular `(00) 00000-0000`, datas `DD/MM/AAAA`,\nsexo `Masculino`/`Feminino`; com `trashed=only` há a coluna extra `Excluído em` (`DD/MM/AAAA HH:MM`).\nCélulas que começam com `=`, `+`, `-`, `@`, tab ou CR recebem um `'` na frente (proteção contra\ninjeção de fórmulas). O \"Try it out\" mostra o CSV como texto; para baixar o arquivo, abra a URL no\nnavegador."
      parameters:
        -
          in: query
          name: search
          description: 'Nome parcial ou CPF completo (como na listagem).'
          example: maria
          required: false
          schema:
            type: string
            description: 'Nome parcial ou CPF completo (como na listagem).'
            example: maria
        -
          in: query
          name: sex
          description: '`M` ou `F`.'
          example: F
          required: false
          schema:
            type: string
            description: '`M` ou `F`.'
            example: F
        -
          in: query
          name: age_min
          description: 'Idade mínima (0 a 150).'
          example: 18
          required: false
          schema:
            type: integer
            description: 'Idade mínima (0 a 150).'
            example: 18
        -
          in: query
          name: age_max
          description: 'Idade máxima (0 a 150).'
          example: 65
          required: false
          schema:
            type: integer
            description: 'Idade máxima (0 a 150).'
            example: 65
        -
          in: query
          name: sort
          description: '`name`, `birth_date` ou `created_at`. Padrão: `name`.'
          example: name
          required: false
          schema:
            type: string
            description: '`name`, `birth_date` ou `created_at`. Padrão: `name`.'
            example: name
        -
          in: query
          name: direction
          description: '`asc` ou `desc`. Padrão: `asc`.'
          example: asc
          required: false
          schema:
            type: string
            description: '`asc` ou `desc`. Padrão: `asc`.'
            example: asc
        -
          in: query
          name: trashed
          description: '`only` exporta apenas a lixeira (com a coluna `Excluído em`).'
          example: only
          required: false
          schema:
            type: string
            description: '`only` exporta apenas a lixeira (com a coluna `Excluído em`).'
            example: only
      responses:
        200:
          description: 'CSV (com BOM UTF-8)'
          content:
            text/plain:
              schema:
                type: string
                example: "Nome;CPF;RG;Data de nascimento;Idade;Sexo;Celular;E-mail;Descrição\nMaria da Silva;625.189.530-60;35688019X;20/07/1996;30;Feminino;(11) 92853-5718;maria@example.com;\"Paciente com miopia leve; retorno anual.\""
      tags:
        - Pacientes
      security: []
  '/api/patients/{patient_id}/audits':
    get:
      summary: 'Histórico de alterações do paciente'
      operationId: histricoDeAlteraesDoPaciente
      description: "Lista as alterações do paciente, da mais recente para a mais antiga (desempate por `id` decrescente),\npaginadas como a listagem. Funciona também para pacientes na lixeira. `event` é `created`, `updated`,\n`deleted` ou `restored`; `changes` traz `{campo: {old, new}}` com os valores crus (como na API): todos os\ncampos em `created`, só os alterados em `updated` e `{}` em `deleted`/`restored`. `user_id` é sempre\n`null` enquanto a API não tem autenticação. Os valores ficam criptografados no banco."
      parameters:
        -
          in: query
          name: page
          description: 'Página desejada. Padrão: 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Página desejada. Padrão: 1.'
            example: 1
        -
          in: query
          name: per_page
          description: 'Itens por página. Padrão: 10; máximo: 100.'
          example: 10
          required: false
          schema:
            type: integer
            description: 'Itens por página. Padrão: 10; máximo: 100.'
            example: 10
      responses:
        200:
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 2
                      event: updated
                      changes:
                        name:
                          old: 'Maria da Silva'
                          new: 'Maria da Silva Lima'
                        phone:
                          old: '11928535718'
                          new: '11911111111'
                      ip: 172.18.0.1
                      user_agent: 'Mozilla/5.0 (X11; Linux x86_64)'
                      user_id: null
                      created_at: '2026-10-27T10:00:00-03:00'
                    -
                      id: 1
                      event: created
                      changes:
                        name:
                          old: null
                          new: 'Maria da Silva'
                        cpf:
                          old: null
                          new: '62518953060'
                        rg:
                          old: null
                          new: 35688019X
                        birth_date:
                          old: null
                          new: '1996-07-20'
                        sex:
                          old: null
                          new: F
                        phone:
                          old: null
                          new: '11928535718'
                        email:
                          old: null
                          new: maria@example.com
                        description:
                          old: null
                          new: null
                      ip: 172.18.0.1
                      user_agent: 'Mozilla/5.0 (X11; Linux x86_64)'
                      user_id: null
                      created_at: '2026-10-26T15:30:00-03:00'
                  links:
                    first: 'http://localhost:8000/api/patients/1/audits?page=1'
                    last: 'http://localhost:8000/api/patients/1/audits?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
                    links:
