      security: []
    parameters:
      -
        in: path
        name: patient_id
        description: 'ID do paciente (ativo ou na lixeira).'
        example: 1
        required: true
        schema:
          type: integer
  '/api/patients/{patient_id}/restore':
    post:
      summary: 'Restaurar paciente'
      operationId: restaurarPaciente
      description: "Restaura um paciente da lixeira (desfaz a exclusão lógica). Falha com 409 se outro paciente ativo\nestiver usando o mesmo CPF (o CPF pode ter sido reutilizado depois da exclusão).\n\nEnquanto o paciente estava na lixeira, seus atendimentos não bloqueavam o horário do profissional. Na\nrestauração, os atendimentos **futuros** do paciente (`scheduled`/`confirmed`) que se sobrepõem a outro\natendimento ativo são cancelados automaticamente, com a anotação \"Cancelado automaticamente ao restaurar o\npaciente: o horário foi ocupado por outro atendimento.\" acrescentada a `notes`. `meta.cancelled_consultations`\nlista os cancelados (`[]` quando não houve conflito). Atendimentos passados e finais não mudam."
      parameters: []
      responses:
        200:
          description: 'Paciente restaurado'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Maria da Silva'
                    cpf: '62518953060'
                    rg: 35688019X
                    birth_date: '1996-07-20'
                    sex: F
                    phone: '11928535718'
                    email: maria@example.com
                    description: 'Paciente com miopia leve, retorno anual.'
                    created_at: '2026-10-26T15:30:00-03:00'
                    updated_at: '2026-10-26T15:45:00-03:00'
                    age: 30
                    deleted_at: null
                    address:
                      cep: '01310100'
                      street: 'Avenida Paulista'
                      number: '1578'
                      complement: 'Sala 12'
                      neighborhood: 'Bela Vista'
                      city: 'São Paulo'
                      state: SP
                    photo_url: 'http://localhost:8000/api/patients/1/photo?v=1'
                  meta:
                    cancelled_consultations:
                      -
                        id: 42
                        scheduled_at: '2027-05-10T10:00:00-03:00'
                        professional_name: 'Dra. Helena Martins'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Maria da Silva'
                      cpf:
                        type: string
                        example: '62518953060'
                      rg:
                        type: string
                        example: 35688019X
                      birth_date:
                        type: string
                        example: '1996-07-20'
                      sex:
                        type: string
                        example: F
                      phone:
                        type: string
                        example: '11928535718'
                      email:
                        type: string
                        example: maria@example.com
                      description:
                        type: string
                        example: 'Paciente com miopia leve, retorno anual.'
                      created_at:
                        type: string
                        example: '2026-10-26T15:30:00-03:00'
                      updated_at:
                        type: string
                        example: '2026-10-26T15:45:00-03:00'
                      age:
                        type: integer
                        example: 30
                      deleted_at:
                        type: string
                        example: null
                      address:
                        type: object
                        properties:
                          cep:
                            type: string
                            example: '01310100'
                          street:
                            type: string
                            example: 'Avenida Paulista'
                          number:
                            type: string
                            example: '1578'
                          complement:
                            type: string
                            example: 'Sala 12'
                          neighborhood:
                            type: string
                            example: 'Bela Vista'
                          city:
                            type: string
                            example: 'São Paulo'
                          state:
                            type: string
                            example: SP
                      photo_url:
                        type: string
                        example: 'http://localhost:8000/api/patients/1/photo?v=1'
                  meta:
                    type: object
                    properties:
                      cancelled_consultations:
                        type: array
                        example:
                          -
                            id: 42
                            scheduled_at: '2027-05-10T10:00:00-03:00'
                            professional_name: 'Dra. Helena Martins'
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 42
                            scheduled_at:
                              type: string
                              example: '2027-05-10T10:00:00-03:00'
                            professional_name:
                              type: string
                              example: 'Dra. Helena Martins'
        404:
          description: 'Paciente não encontrado ou não excluído'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Paciente não encontrado.'
                properties:
                  message:
                    type: string
                    example: 'Paciente não encontrado.'
        409:
          description: 'CPF em uso por outro paciente ativo'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Já existe um paciente ativo com este CPF.'
                properties:
                  message:
                    type: string
                    example: 'Já existe um paciente ativo com este CPF.'
      tags:
        - Pacientes
      security: []
    parameters:
      -
        in: path
        name: patient_id
        description: 'ID do paciente excluído.'
        example: 1
        required: true
        schema:
          type: integer
  /api/patients:
    get:
      summary: 'Listar pacientes'
      operationId: listarPacientes
      description: "Retorna os pacientes ativos (não excluídos), com paginação no formato padrão do Laravel. Com `trashed=only`,\nlista apenas os pacientes da lixeira (excluídos), com `deleted_at` preenchido; busca, ordenação e paginação\ncontinuam valendo. Cada paciente traz `age` (idade em anos completos no fuso America/Sao_Paulo).\nOs filtros (`search`, `sex`, `age_min`, `age_max`) se combinam entre si e com a lixeira; todos os\nparâmetros são mantidos nos links de paginação."
      parameters:
        -
          in: query
          name: search
          description: 'Busca por parte do nome, ou pelo CPF (com ou sem máscara): completo ou qualquer trecho de 3 ou mais dígitos.'
          example: maria
          required: false
          schema:
            type: string
            description: 'Busca por parte do nome, ou pelo CPF (com ou sem máscara): completo ou qualquer trecho de 3 ou mais dígitos.'
            example: maria
        -
          in: query
          name: sex
          description: 'Filtra por sexo: `M` ou `F` (outro valor é ignorado).'
          example: F
          required: false
          schema:
            type: string
            description: 'Filtra por sexo: `M` ou `F` (outro valor é ignorado).'
            example: F
        -
          in: query
          name: age_min
          description: 'Idade mínima em anos completos (0 a 150; valor inválido é ignorado).'
          example: 18
          required: false
          schema:
            type: integer
            description: 'Idade mínima em anos completos (0 a 150; valor inválido é ignorado).'
            example: 18
        -
          in: query
          name: age_max
          description: 'Idade máxima em anos completos (0 a 150; valor inválido é ignorado).'
          example: 65
          required: false
          schema:
            type: integer
            description: 'Idade máxima em anos completos (0 a 150; valor inválido é ignorado).'
            example: 65
        -
          in: query
          name: page
          description: 'Página desejada. Padrão: 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Página desejada. Padrão: 1.'
            example: 1
        -
          in: query
          name: per_page
          description: 'Itens por página. Padrão: 10; máximo: 100 (valores maiores são limitados a 100).'
          example: 10
          required: false
          schema:
            type: integer
            description: 'Itens por página. Padrão: 10; máximo: 100 (valores maiores são limitados a 100).'
            example: 10
        -
          in: query
          name: sort
          description: 'Campo de ordenação: `name`, `birth_date` ou `created_at`. Padrão: `name` (valor fora da lista também usa `name`).'
          example: name
          required: false
          schema:
            type: string
            description: 'Campo de ordenação: `name`, `birth_date` ou `created_at`. Padrão: `name` (valor fora da lista também usa `name`).'
            example: name
        -
          in: query
          name: direction
          description: 'Sentido da ordenação: `asc` ou `desc`. Padrão: `asc` (valor inválido também usa `asc`). O desempate é sempre por `id` crescente.'
          example: asc
          required: false
          schema:
            type: string
            description: 'Sentido da ordenação: `asc` ou `desc`. Padrão: `asc` (valor inválido também usa `asc`). O desempate é sempre por `id` crescente.'
            example: asc
        -
          in: query
          name: trashed
          description: 'Use `only` para listar apenas os pacientes excluídos (lixeira).'
          example: only
          required: false
          schema:
            type: string
            description: 'Use `only` para listar apenas os pacientes excluídos (lixeira).'
            example: only
      responses:
        200:
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      name: 'Maria da Silva'
                      cpf: '62518953060'
                      rg: 35688019X
                      birth_date: '1996-07-20'
                      sex: F
                      phone: '11928535718'
                      email: maria@example.com
                      description: 'Paciente com miopia leve, retorno anual.'
                      created_at: '2026-10-26T15:30:00-03:00'
                      updated_at: '2026-10-26T15:30:00-03:00'
                      age: 30
                      deleted_at: null
                      address:
                        cep: '01310100'
                        street: 'Avenida Paulista'
                        number: '1578'
                        complement: null
                        neighborhood: 'Bela Vista'
                        city: 'São Paulo'
                        state: SP
                      photo_url: null
                    -
                      id: 2
                      name: 'João Pereira Santos'
                      cpf: '52998224725'
                      rg: '123456789'
                      birth_date: '1980-03-15'
                      sex: M
                      phone: '1133334444'
                      email: null
                      description: null
                      created_at: '2026-10-26T15:31:00-03:00'
                      updated_at: '2026-10-26T15:31:00-03:00'
                      age: 46
                      deleted_at: null
                      address: null
                      photo_url: null
                  links:
                    first: 'http://localhost:8000/api/patients?page=1'
                    last: 'http://localhost:8000/api/patients?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
