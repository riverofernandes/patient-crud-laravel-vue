                        label: '1'
                        active: true
                      -
                        url: null
                        label: 'Next &raquo;'
                        active: false
                    path: 'http://localhost:8000/api/patients/1/audits'
                    per_page: 10
                    to: 2
                    total: 2
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 2
                        event: updated
                        changes:
                          name:
                            old: 'Maria da Silva'
                            new: 'Maria da Silva Lima'
                          phone:
                            old: '11928535718'
                            new: '11911111111'
                        ip: 172.18.0.1
                        user_agent: 'Mozilla/5.0 (X11; Linux x86_64)'
                        user_id: null
                        created_at: '2026-10-27T10:00:00-03:00'
                      -
                        id: 1
