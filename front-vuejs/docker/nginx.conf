server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2 application/xml;

    # Hashed build assets: cache for a year. A missing chunk must be a real 404,
    # never index.html (which would then be cached as "immutable").
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        # no "always": a 404 must not be cached as immutable
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # The SPA shell must always be revalidated so new deploys are picked up.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Container health check (no logs).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # History-mode routing: unknown paths (e.g. /pacientes/1/editar) get the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
