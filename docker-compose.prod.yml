# Production-like stack: immutable images, no bind mounts, debug off.
# Usage (see README): keep APP_KEY in a git-ignored .env.prod so it never changes between deploys:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
name: patients-prod

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: patients
      MYSQL_USER: patients
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: ./php-laravel
      target: prod
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_KEY: ${APP_KEY:?set APP_KEY in .env.prod (see .env.prod.example) and run with --env-file .env.prod}
      APP_URL: http://localhost:${API_PORT:-8000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: patients
      DB_USERNAME: patients
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${WEB_PORT:-8080}}
      # Optional dedicated key for the CPF blind index (empty = derived from APP_KEY). After changing it,
      # restart the api: the entrypoint re-hashes the CPFs when the key fingerprint changes.
      CPF_HASH_KEY: ${CPF_HASH_KEY:-}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-300}
      PHOTO_RATE_LIMIT: ${PHOTO_RATE_LIMIT:-1200}
      SEED_ON_START: ${SEED_ON_START:-false}
    volumes:
      # Encrypted patient photos and exam attachments. Back up together with the DB and APP_KEY.
      - api-private:/var/www/html/storage/app/private
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./front-vuejs
      args:
        # Baked into the bundle and resolved by the browser.
        VITE_API_URL: http://localhost:${API_PORT:-8000}/api
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  mysql-data:
  api-private:
